[project]
name = "unpronounceable-generator"
version = "0.1.0"
description = "「How to Pronounce」ネタ動画を自動生成するパイプライン(発音不能なZalgo風単語 + TTS/グリッチ音 + 動画合成)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "playwright>=1.40",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# ruffのバージョンが上がるにつれ「未指定時のデフォルト」ルール集合が
# 静かに拡張されていき(flake8-bandit/flake8-blind-except等の意見の強い
# 拡張ルールまで含まれるようになった)、このリポジトリが意図的に使っている
# 「クリーンアップや1本の失敗を握りつぶす」ような広いexcept節まで
# エラー扱いになってしまった。CIのlintゲートがruffのバージョン更新で
# 予告なく壊れないよう、pyflakes中心の伝統的なデフォルト集合を明示的に
# 固定している。
select = ["E4", "E7", "E9", "F"]

# pytestの設定は pytest.ini 側に集約しているため、ここには置いていない
# (両方に書くと "ignoring pytest config in pyproject.toml" という警告が出る)

name: generate

on:
  workflow_dispatch:
    inputs:
      count:
        description: "生成する本数"
        required: false
        default: "3"
      mode:
        description: "音声の作り方 (tts / tts_extreme / glitch / morse / random)"
        required: false
        default: "tts"
        type: choice
        options:
          - tts
          - tts_extreme
          - glitch
          - morse
          - random
      voice:
        description: "[tts/tts_extreme専用] espeak-ngの声 (例: en, en-us, ja)"
        required: false
        default: "en"
      seed:
        description: "乱数シード(再現したい場合。空欄なら毎回ランダム)"
        required: false
        default: ""
      upload:
        description: "生成した動画をそのままYouTubeにアップロードする"
        required: false
        default: true
        type: boolean
      privacy_status:
        description: "[upload時のみ] アップロード時の公開範囲"
        required: false
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private

permissions:
  contents: write
  # compile_shorts.pyがGitHub Actions APIで過去の動画生成アーティファクト
  # を取得するために必要(YouTubeへのyt-dlp再ダウンロードをやめたため)。
  actions: read

# upload_history.json/compilation_state.json をこのワークフローがgit push
# するため、手動実行が重なった場合に同じファイルへのpushが競合したり、
# 結合バッチが二重に処理されたりしないよう同時実行を1本に制限する。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg \
            fonts-noto-core fonts-noto-extra fonts-noto-ui-core fonts-noto-ui-extra

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Generate videos
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # 任意。設定しておくと、複数チャンネルを持つアカウントで誤った
          # チャンネルにアップロードしそうな場合にアップロード前に検知して止まる
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          # 任意。設定しておくと、リフレッシュトークンの7日失効(テスト
          # ステータス時)が近づいた/過ぎた際にログへ警告が出る
          YOUTUBE_REFRESH_TOKEN_ISSUED_AT: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ISSUED_AT }}
        run: |
          args=(--count "${{ inputs.count }}" --outdir ./out --mode "${{ inputs.mode }}" --voice "${{ inputs.voice }}")
          if [ -n "${{ inputs.seed }}" ]; then
            args+=(--seed "${{ inputs.seed }}")
          fi
          if [ "${{ inputs.upload }}" = "true" ]; then
            args+=(--upload --privacy-status "${{ inputs.privacy_status }}")
          fi
          python3 generate.py "${args[@]}"

      # compile_shorts.pyが後で(この回も含めて)GitHub Actions API経由で
      # 動画本体を取得し直せるよう、YouTubeへのアップロードより前(という
      # より、compile_shorts.py実行より前)にアーティファクトとして
      # 保存しておく必要がある(out/の中身はこの時点以降変化しないため、
      # ここでアップロードして問題ない)。
      - name: Upload generated videos (backup/audit + compile_shorts.py用)
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: out/
          if-no-files-found: error

      # upload_history.jsonに公開済みShortsが10本たまるごとに、各動画が
      # 生成された回のgenerated-videosアーティファクト(GitHub Actions API
      # 経由)から動画本体を取得し直し、横型(16:9)の結合動画としてアップ
      # ロードする。アップロードしていない回(upload=false)は履歴が増えない
      # ため、結合する対象もないのでスキップする。本編パイプラインとは独立
      # した追加機能なので、失敗しても後続の処理はブロックしない
      # (compile_shorts.py側で例外を吸収する)。
      - name: Compile Shorts into a regular video (every 10 videos)
        if: ${{ inputs.upload }}
        run: python3 compile_shorts.py --privacy-status "${{ inputs.privacy_status }}"
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_REFRESH_TOKEN_ISSUED_AT: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ISSUED_AT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated upload history and compilation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add upload_history.json compilation_state.json
          git diff --cached --quiet || git commit -m "chore: update upload history"

          # git push はGitHub側の一時的な障害で失敗することがある。この時点で
          # 動画は既にYouTubeへアップロード済みなので、ここで諦めると
          # upload_history.jsonへの記録だけが失われ、結合動画の対象カウントが
          # ずれてしまう。そのため数回リトライする(間にpull --rebaseを挟み、
          # 他の実行が先にpushしていた場合にも追従できるようにする)。
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "git push 失敗(${attempt}回目)。リトライします。"
            sleep $((attempt * 10))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          echo "git push が複数回失敗しました。upload_history.json の更新が反映されていない" \
               "可能性があります。手動での確認・修正が必要です。"
          exit 1

      # compilation_output/ は10件たまった回にしか作られないため、
      # それ以外の日は対象ファイルなしで正常にスキップされる。
      - name: Upload compilation video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: compilation-output-${{ github.run_number }}
          path: compilation_output/
          if-no-files-found: ignore

name: generate

on:
  workflow_dispatch:
    inputs:
      count:
        description: "生成する本数"
        required: false
        default: "1"
      mode:
        description: "音声の作り方 (tts / tts_extreme / glitch / reverse / robot_voice / chorus / morse / telephone / slowed_reverb / nightcore / underwater / 8d_audio / echo_cave / random)"
        required: false
        default: "tts"
        type: choice
        options:
          - tts
          - tts_extreme
          - glitch
          - reverse
          - robot_voice
          - chorus
          - morse
          - telephone
          - slowed_reverb
          - nightcore
          - underwater
          - 8d_audio
          - echo_cave
          - random
      voice:
        description: "[tts/tts_extreme/reverse/robot_voice/telephone/slowed_reverb/nightcore/underwater/8d_audio/echo_cave専用] 言語を選択(男性ボイス固定。性別・任意のespeak-ngコードを指定したい場合はローカルでgenerate.pyを直接実行してください)"
        required: false
        default: "random | ランダム"
        type: choice
        options:
          - "random | ランダム"
          - "en | English"
          - "fr | French"
          - "de | German"
          - "hu | Hungarian"
          - "sv | Swedish"
          - "zh | Mandarin"
          - "yue | Cantonese"
          - "fi | Finnish"
          - "is | Icelandic"
          - "vi | Vietnamese"
          - "id | Indonesian"
          - "ms | Malay"
          - "pt-br | Portuguese (Brazil)"
          - "pt | Portuguese (Portugal)"
          - "ro | Romanian"
          - "ru | Russian"
          - "th | Thai"
          - "ar | Arabic"
          - "he | Hebrew"
          - "ko | Korean"
          - "hi | Hindi"
          - "es | Spanish"
          - "pl | Polish"
          - "bs | Bosnian"
          - "ug | Uyghur"
          - "am | Amharic"
          - "kk | Kazakh"
          - "lt | Lithuanian"
      word:
        description: "単語を指定する場合のみ(視聴者リクエスト対応用)。指定するとcountは1本に固定され、過去の単語との重複チェックも行わない。アップロード時はprivacy_statusの選択に関わらず必ず非公開(private)になる(内容確認後、手動でYouTube Studio側の公開設定を切り替える想定)。空欄ならランダム生成"
        required: false
        default: ""
      seed:
        description: "乱数シード(再現したい場合。空欄なら毎回ランダム)"
        required: false
        default: ""
      upload:
        description: "生成した動画をそのままYouTubeにアップロードする"
        required: false
        default: true
        type: boolean
      privacy_status:
        description: "[upload時のみ] アップロード時の公開範囲"
        required: false
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private

permissions:
  contents: write
  # repost_shorts.pyがGitHub Actions APIで過去の動画生成アーティファクト
  # を取得するために必要(YouTubeへのyt-dlp再ダウンロードをやめたため)。
  actions: read

# upload_history.json/repost_state.json をこのワークフローがgit push
# するため、手動実行が重なった場合に同じファイルへのpushが競合したり、
# 同じ動画が二重に変換されたりしないよう同時実行を1本に制限する。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # ランナー側の一時的な不調(aptミラーが応答を返さないまま固まる等)で
    # ジョブがスタックすると、concurrency(cancel-in-progress: false)により
    # 後続の定期実行が丸ごと詰まってしまう(実機で3時間以上スタックし、
    # 次の実行がキューで待たされ続ける事故を確認)。通常は数分〜長くても
    # 二十数分で完了する(Playwright Chromiumのダウンロードが遅い場合が
    # 一番時間がかかる)ため、十分な余裕を見て30分で強制終了する。
    timeout-minutes: 30
    steps:
      # refを明示しないと、actions/checkout@v4はgithub.sha(このジョブが
      # ディスパッチ/キューされた時点のmainの先端)をそのままチェックアウト
      # してしまう。concurrency(cancel-in-progress: false)で前の実行の
      # 終了待ちになっている間にmainが進んでいても追従されず、ジョブ開始時
      # には既に古いコミットを見ている状態になる。これが原因で2026-10-13に
      # 実機事故が発生した(直前の実行がupload_history.json/repost_state.json
      # を更新してpushした直後に、古いチェックアウトのまま始まった次の実行が
      # 同じファイルに別の追記を試みてpushが衝突、git rebaseがdetached HEADで
      # 止まった挙句、同じShortsが2本重複して通常動画に変換されてしまった)。
      # refを明示すると、ジョブが実際に開始する時点のブランチ先端を
      # 再解決してチェックアウトするようになり、これを防げる。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg \
            fonts-noto-core fonts-noto-extra fonts-noto-ui-core fonts-noto-ui-extra \
            fonts-noto-cjk \
            mbrola mbrola-us1 mbrola-fr4 mbrola-de1 mbrola-hu1 mbrola-sw2 \
            mbrola-br4 mbrola-pt1 mbrola-es3 mbrola-pl1
          # mbrola-*は--voice random(config.VOICE_LANGUAGES参照)の女性ボイス用
          # (MBROLA音声データが確認できた9言語: en/fr/de/hu/sv/pt-br/pt/es/pl。
          # トルコ語はREADME「ハマった罠」26番の理由で言語プール自体から
          # 撤去したため、mbrola-tr2は不要)。
          # それ以外の言語は、espeak-ng本体に内蔵の"+f3"フォルマントバリアント
          # で女性ボイスを代替しているため追加パッケージ不要(config.py
          # VOICE_LANGUAGESのコメント参照)。
          # fonts-noto-cjkは韓国語(ハングル)の描画に必要(frame_builder.pyの
          # FRAME_CSS_FONT_STACKは元々'Noto Sans CJK JP'を含んでいたが、この
          # パッケージが入っていなかったため実際には豆腐になっていた。
          # 「ハマった罠」参照)。日本語ボイス自体は言語プールから撤去済みだが、
          # --wordで日本語の文字列を手動指定された場合のひらがな描画のために
          # 'Noto Sans CJK JP'はFRAME_CSS_FONT_STACKに残してある。

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Generate videos
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # 任意。設定しておくと、複数チャンネルを持つアカウントで誤った
          # チャンネルにアップロードしそうな場合にアップロード前に検知して止まる
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          # 任意。設定しておくと、リフレッシュトークンの7日失効(テスト
          # ステータス時)が近づいた/過ぎた際にログへ警告が出る
          YOUTUBE_REFRESH_TOKEN_ISSUED_AT: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ISSUED_AT }}
          # 任意。設定しておくと、アップロードした各Shortsをこの再生リストに自動追加する
          YOUTUBE_SHORTS_PLAYLIST_ID: ${{ secrets.YOUTUBE_SHORTS_PLAYLIST_ID }}
          # WORDはワークフロー入力の自由記述文字列なので、run:のスクリプト本文に
          # 直接埋め込まず環境変数経由で渡す(引用符や$(...)等が含まれても
          # スクリプトの構文を壊さないようにするため)
          WORD: ${{ inputs.word }}
        run: |
          # voice入力は選択式(「<コード> | <言語名>」形式のoptions、workflow.yml参照)
          # なので、generate.pyに渡す実際のコード部分だけを取り出す
          voice_code="${{ inputs.voice }}"
          voice_code="${voice_code%% | *}"
          args=(--count "${{ inputs.count }}" --outdir ./out --mode "${{ inputs.mode }}" --voice "$voice_code")
          if [ -n "${{ inputs.seed }}" ]; then
            args+=(--seed "${{ inputs.seed }}")
          fi
          if [ "${{ inputs.upload }}" = "true" ]; then
            privacy_status="${{ inputs.privacy_status }}"
            if [ -n "$WORD" ]; then
              # 単語指定(視聴者リクエスト対応)の回は、privacy_statusの選択に
              # 関わらず必ず非公開(private)でアップロードする。いきなり公開
              # されてしまう事故を防ぎ、内容を確認してから手動でYouTube Studio
              # 側の公開設定を切り替える運用にするため。
              privacy_status="private"
            fi
            args+=(--upload --privacy-status "$privacy_status")
          fi
          if [ -n "$WORD" ]; then
            args+=(--word "$WORD")
          fi
          python3 generate.py "${args[@]}"

      # repost_shorts.pyが後で(この回も含めて)GitHub Actions API経由で
      # 動画本体を取得し直せるよう、YouTubeへのアップロードより前(という
      # より、repost_shorts.py実行より前)にアーティファクトとして
      # 保存しておく必要がある(out/の中身はこの時点以降変化しないため、
      # ここでアップロードして問題ない)。
      - name: Upload generated videos (backup/audit + repost_shorts.py用)
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: out/
          if-no-files-found: error

      # 直前の「Generate videos」ステップで今まさに生成・アップロードされた
      # Shorts全件を、同じ単語のまま横型(16:9)にピラーボックスした「通常
      # 動画」として常に優先して再アップロードする(同じGITHUB_RUN_IDで
      # 紐付け、select_targets()参照)。そのうえで余力があれば、
      # upload_history.jsonに記録された過去の未変換バックログも
      # config.REPOST_BACKLOG_PER_RUNぶんだけ追加で変換する。動画本体は
      # generated-videosアーティファクト(GitHub Actions API経由)から取得
      # し直す。アップロードしていない回(upload=false)は履歴が増えないため、
      # 変換する対象もないのでスキップする。本編パイプラインとは独立した
      # 追加機能なので、失敗しても後続の処理はブロックしない
      # (repost_shorts.py側で例外を吸収する)。
      #
      # word指定(視聴者リクエスト対応)の回もスキップする。このステップは
      # 常にバックログも合わせて変換してしまうため、1本だけ素早く確認したい
      # リクエスト対応の趣旨に反して無駄に時間がかかるうえ、--privacy-status
      # が一律に適用される(今回の回だけprivateに上書きする仕組みが効かない)
      # ため、確認前のはずの動画が通常動画側だけ先に公開されてしまう。
      - name: Repost Shorts as regular videos
        if: ${{ inputs.upload && !inputs.word }}
        run: python3 repost_shorts.py --privacy-status "${{ inputs.privacy_status }}"
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_REFRESH_TOKEN_ISSUED_AT: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ISSUED_AT }}
          # 任意。設定しておくと、変換した通常動画をこの再生リストに自動追加する
          YOUTUBE_REPOST_PLAYLIST_ID: ${{ secrets.YOUTUBE_REPOST_PLAYLIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated upload history and repost state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # upload_history.json/repost_state.json/quota_usage.jsonは複数の
          # 実行がそれぞれ追記・加算するだけのファイルで、通常のテキスト
          # マージだと同じ配列末尾への追記同士が行単位で衝突する(.gitattributes
          # で割り当て、実体はmerge_tracking_json.py参照)。git pull --rebase
          # (後述)がこれらのファイルで衝突した際、意味的に正しく統合して
          # 自動解決できるようにする。
          git config merge.tracking-json.name "generate.yml tracking files (JSON-aware union merge)"
          git config merge.tracking-json.driver "python3 merge_tracking_json.py %O %A %B %P"

          git add upload_history.json repost_state.json
          # quota_usage.json は upload=false の実行では作られないため、
          # 存在する場合のみ追加する(存在しないパスをgit addすると
          # このスクリプト全体が-eで即終了してしまう)。
          if [ -f quota_usage.json ]; then
            git add quota_usage.json
          fi
          git diff --cached --quiet || git commit -m "chore: update upload history"

          # git push はGitHub側の一時的な障害で失敗することがある。この時点で
          # 動画は既にYouTubeへアップロード済みなので、ここで諦めると
          # upload_history.json/repost_state.jsonへの記録だけが失われ、次回
          # repost_shorts.pyの変換対象の判定がずれてしまう。そのため数回
          # リトライする(間にpull --rebaseを挟み、他の実行が先にpushして
          # いた場合にも追従できるようにする)。
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "git push 失敗(${attempt}回目)。リトライします。"
            sleep $((attempt * 10))
            # 上記のmergeドライバで解決できない(対象外のファイル、または
            # ドライバ自体が失敗した)衝突が残った場合、rebaseが中途半端な
            # detached HEAD状態で止まり、以降のリトライが全て無意味な
            # エラーで失敗し続けてしまう(2026-10-13に実機で発生)。
            # 確実に次のリトライへ進めるよう、rebase失敗時は必ず中断する。
            git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort
          done
          echo "git push が複数回失敗しました。upload_history.json の更新が反映されていない" \
               "可能性があります。手動での確認・修正が必要です。"
          exit 1

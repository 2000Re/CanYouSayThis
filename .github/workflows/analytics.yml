name: analytics

on:
  workflow_dispatch:
    inputs:
      days:
        description: "集計対象の日数(start-date/end-date未指定時のみ使用)"
        required: false
        default: "28"
      start_date:
        description: "集計開始日(YYYY-MM-DD。指定した場合はdaysより優先)"
        required: false
        default: ""
      end_date:
        description: "集計終了日(YYYY-MM-DD。空欄なら今日)"
        required: false
        default: ""

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Summarize views/retention by mode
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          # yt-analytics.readonlyスコープを含めて再発行したリフレッシュ
          # トークンが必要(README「モード別パフォーマンス集計」参照)。
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          args=()
          if [ -n "${{ inputs.start_date }}" ]; then
            args+=(--start-date "${{ inputs.start_date }}")
          fi
          if [ -n "${{ inputs.end_date }}" ]; then
            args+=(--end-date "${{ inputs.end_date }}")
          fi
          if [ -z "${{ inputs.start_date }}" ]; then
            args+=(--days "${{ inputs.days }}")
          fi
          python3 youtube_analytics.py "${args[@]}"

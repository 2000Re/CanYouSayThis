name: traffic-source

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "対象の動画ID"
        required: true
      days:
        description: "集計対象の日数(過去何日分)"
        required: false
        default: "28"

jobs:
  traffic-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch traffic source breakdown
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          # 動画IDは "-" で始まることがあり(YouTubeの動画ID自体が
          # [A-Za-z0-9_-]を使う仕様)、"--video-id VALUE"(空白区切り)だと
          # argparseがVALUEを新しいオプションだと誤認して
          # "expected one argument" エラーになる(実機で確認)。
          # "--video-id=VALUE" の形にすることで、先頭が "-" の値でも
          # 確実にこのオプションの値として渡せる。
          python3 youtube_traffic_source.py --video-id="${{ inputs.video_id }}" --days="${{ inputs.days }}"

name: traffic-source

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "対象の動画ID"
        required: true
      days:
        description: "集計対象の日数(過去何日分)"
        required: false
        default: "28"
      search_queries:
        description: "trueならYT_SEARCH経由の再生を実際の検索クエリ別にも表示する"
        required: false
        default: "false"
        type: boolean

jobs:
  traffic-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch traffic source breakdown
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          args=(--video-id "${{ inputs.video_id }}" --days "${{ inputs.days }}")
          if [ "${{ inputs.search_queries }}" = "true" ]; then
            args+=(--search-queries)
          fi
          python3 youtube_traffic_source.py "${args[@]}"
